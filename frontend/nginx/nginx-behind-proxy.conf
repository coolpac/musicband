# Frontend nginx — runs behind the host-level nginx reverse proxy (TLS is terminated there;
# the host forwards plain HTTP with the original Host header).
#
# ONE container, TWO virtual hosts, routed by Host:
#
#   vgulcover.ru       → the public website (SSR container `site`, static snapshot fallback).
#                        Default server, so healthchecks and unknown hosts land here.
#   vgul.cyberslon.ru  → the Telegram/Max Mini App and /admin (SPA shell from dist/index.html).
#                        noindex everywhere: it must never compete with the site in search.
#
# Old Mini App links on vgulcover.ru (bot buttons built before the split, «/?screen=…», /admin)
# are redirected to the Mini App host — see nginx/site-locations.conf.
#
# Shared locations live in nginx/common-locations.conf; the site's routing in
# nginx/site-locations.conf (+ nginx/site-maps.conf at http level).

# ============================================================================
# Public website — vgulcover.ru
# ============================================================================
server {
    listen 80 default_server;
    server_name vgulcover.ru www.vgulcover.ru;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_static on;

    include /etc/nginx/snippets/common-locations.conf;

    # /, /booking*, /privacy…, /robots.txt, /sitemap.xml → SSR; /site/ icons; Mini App redirects.
    include /etc/nginx/snippets/site-locations.conf;

    # Everything else is not a page of this site: let the SSR server answer with the site's own
    # 404 page and a real 404 status. Nothing from dist/ is served here except through the
    # explicit locations above — the Mini App shell has no business on this host.
    location / {
        try_files /__site-ssr__ @site_ssr;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ============================================================================
# Telegram / Max Mini App + admin — vgul.cyberslon.ru
# ============================================================================
server {
    listen 80;
    server_name vgul.cyberslon.ru;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_static on;

    include /etc/nginx/snippets/common-locations.conf;

    # The Mini App is an application, not content: keep every crawler out.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The site's SSR template and its prerendered snapshots ship in dist/ but belong to the other host.
    location = /site.html {
        internal;
    }
    location ^~ /site-static/ {
        internal;
    }

    # index.html — never cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # frame-ancestors вместо X-Frame-Options: разрешаем встраивание Mini App в Telegram и Max.
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.telegram.org https://web.telegram.org https://*.max.ru https://max.ru" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 0;
    }

    # SPA fallback: /, /app, /admin and every client-side route
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.telegram.org https://web.telegram.org https://*.max.ru https://max.ru" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 0;
    }

    # nginx drops inherited add_header inside any location that declares its own, so the two
    # HTML locations above repeat this set. These apply to the shared locations (assets, api…).
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.telegram.org https://web.telegram.org https://*.max.ru https://max.ru" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
