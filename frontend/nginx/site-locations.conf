# ─────────────────────────────────────────────────────────────────────────────
# Public website «ВГУЛ» — server-level routing.
#
# Included with ONE line from nginx.conf, nginx-behind-proxy.conf and nginx-ssl.conf, inside the
# serving server block and just before their catch-all `location /`. Everything site-related lives
# here so the three near-duplicate configs keep a one-line diff (and a one-line merge conflict).
#
# The http-level `map`s it depends on are in nginx/site-maps.conf.
#
# Contract:
#   /  /booking  /booking/form  /booking/success  /privacy  /terms  /offer  (+ trailing slash)
#   /robots.txt  /sitemap.xml            → the `site` SSR container, static snapshot on failure
#   /?screen=… /?start=… (see site-maps)  → 302 to the Mini App host, query intact
#   /app  /app/*  /admin  /admin/*      → 301 to the Mini App host ($mini_app_origin)
#   /site/*                             → icons / manifest / OG image, 7 days
#   /site-static/*  /site.html          → internal only (fallback snapshots, SSR template)
#   everything else                     → the including server block decides
# ─────────────────────────────────────────────────────────────────────────────

# Docker's embedded DNS. Combined with the $site_upstream variable in @site_ssr this makes the
# `site` hostname resolve per request instead of at configuration load — which is what lets nginx
# START when the site container is absent or rebuilding. A literal `proxy_pass http://site:4000`
# would abort the config and take the Mini App down with it.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

# ── The site's own routes ────────────────────────────────────────────────────
# Exact matches only, so nothing else can be captured by accident. Each one is a no-op
# `try_files` probe whose only job is to jump into the single @site_ssr block below —
# that keeps one copy of the proxy configuration instead of twelve.

location = / {
    # A Mini App launch that still lands on the old host (bot buttons and referral links built
    # before the split, cached deep links): hand it to the Mini App host with the query intact.
    # 302, not 301 — the answer depends on the query string, a client must not cache it per URL.
    # `if` + `return` is the one safe form of `if` inside a location.
    if ($mini_app_launch) {
        return 302 $mini_app_origin$request_uri;
    }
    try_files /__site-ssr__ @site_ssr;
}

location = /booking          { try_files /__site-ssr__ @site_ssr; }
location = /booking/         { try_files /__site-ssr__ @site_ssr; }
location = /booking/form     { try_files /__site-ssr__ @site_ssr; }
location = /booking/form/    { try_files /__site-ssr__ @site_ssr; }
location = /booking/success  { try_files /__site-ssr__ @site_ssr; }
location = /booking/success/ { try_files /__site-ssr__ @site_ssr; }
location = /privacy          { try_files /__site-ssr__ @site_ssr; }
location = /privacy/         { try_files /__site-ssr__ @site_ssr; }
location = /terms            { try_files /__site-ssr__ @site_ssr; }
location = /terms/           { try_files /__site-ssr__ @site_ssr; }
location = /offer            { try_files /__site-ssr__ @site_ssr; }
location = /offer/           { try_files /__site-ssr__ @site_ssr; }
location = /robots.txt       { try_files /__site-ssr__ @site_ssr; }
location = /sitemap.xml      { try_files /__site-ssr__ @site_ssr; }

# ── SSR upstream ─────────────────────────────────────────────────────────────
location @site_ssr {
    set $site_upstream http://site:4000;
    # With a variable upstream nginx no longer appends the request URI itself — $request_uri is
    # the original, undecoded path + query, which is exactly what the SSR server expects.
    proxy_pass $site_upstream$request_uri;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $site_forwarded_proto;

    # The site must never make a visitor wait on a sick upstream: fail fast to the snapshot.
    proxy_connect_timeout 1s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;

    # 5xx (and a container that is down, which nginx reports as 502/504) → prerendered snapshot,
    # served with a 200 so crawlers never see an error page. 301 (trailing-slash canonicalisation)
    # and 404 (unknown paths, empty legal pages) are the SSR server's own answers and pass through.
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @site_snapshot;

    # @site_snapshot needs a SECOND error_page hop (missing snapshot → 404 → the 404 page).
    # nginx performs only one hop per request unless recursive_error_pages is enabled, and it reads
    # that flag from the location where the FIRST error_page fires — i.e. here. Without this the
    # legal pages would answer with nginx's stock «404 Not Found» while the site is down.
    recursive_error_pages on;

    # The SSR service sends HTML uncompressed; nginx compresses it on the way out.
    # `gzip_proxied any` is required — by default nothing from an upstream is compressed.
    gzip on;
    gzip_proxied any;

    # nginx drops inherited add_header as soon as a level declares one of its own, so the
    # server-level security headers have to be repeated in every location that answers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ── Static fallback when the SSR service is unreachable ──────────────────────
location @site_snapshot {
    # $site_snapshot_file comes from nginx/site-maps.conf. Routes without a snapshot (the legal
    # pages) map to a file that does not exist → try_files raises 404 → error_page serves the
    # prerendered 404 page, keeping the 404 status. A soft 404 would poison the index.
    recursive_error_pages on;
    error_page 404 /site-static/404.html;
    try_files $site_snapshot_file =404;

    charset utf-8;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Site-Data "snapshot" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# The SSR template ships inside dist/ (nginx needs it in the image only because the `site`
# container is built from the same stage), and `location /` would happily serve it. Left open it is
# a second, unrendered copy of the home page — empty <div id="site-root">, hydrated client-side —
# i.e. duplicate content with no SSR markup. Nothing ever requests it through nginx.
location = /site.html {
    internal;
}

location ^~ /site-static/ {
    # Reachable only through @site_snapshot / error_page — never directly, so the snapshots
    # cannot compete with the live pages for indexing.
    internal;

    charset utf-8;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Site-Data "snapshot" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ── The Mini App and the admin moved to $mini_app_origin ─────────────────────
# Anything that reaches these paths on the website host is an old link (bot messages, bookmarks,
# the hash shim in site.html when built without VITE_MINI_APP_URL). Permanent redirect, query kept.
location = /app       { return 301 $mini_app_origin$request_uri; }
location ^~ /app/     { return 301 $mini_app_origin$request_uri; }
location = /admin     { return 301 $mini_app_origin$request_uri; }
location ^~ /admin/   { return 301 $mini_app_origin$request_uri; }

# ── Site icons, manifest and OG image (frontend/public/site → dist/site) ─────
location = /site/manifest.webmanifest {
    # nginx's stock mime.types has no mapping for .webmanifest; the empty `types` block clears the
    # inherited map so default_type applies to this one file.
    types { }
    default_type application/manifest+json;

    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}

location ^~ /site/ {
    # Unhashed filenames referenced from <head>, regenerated only by
    # `node scripts/generate-site-icons.mjs` — a week of caching is the right trade.
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}
