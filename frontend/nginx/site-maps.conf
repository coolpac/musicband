# ─────────────────────────────────────────────────────────────────────────────
# Public website «ВГУЛ» — http-level part of the routing.
#
# `map` is only valid at http level, so it cannot live inside nginx/site-locations.conf
# (which is included from inside a server block). frontend/Dockerfile copies this file to
# /etc/nginx/conf.d/00-site-maps.conf, which the stock nginx.conf picks up via
# `include /etc/nginx/conf.d/*.conf;` — the `00-` prefix only keeps it readable in listings,
# nginx resolves map variables after the whole configuration is parsed.
#
# Keep in sync with nginx/site-locations.conf.
# ─────────────────────────────────────────────────────────────────────────────

# Where the Telegram/Max Mini App lives now. The ONE place nginx knows the Mini App host;
# the same value is MINI_APP_URL for the backend and VITE_MINI_APP_URL for the site build.
map "" $mini_app_origin {
    default  https://vgul.cyberslon.ru;
}

# Mini App launches that still land on the website's «/».
#
# Bot buttons, referral links and deep links were built with the old MINI_APP_URL for years and
# cached links never die — so these query parameters on «/» mean «this is the Mini App, not the
# site», and nginx/site-locations.conf forwards them to $mini_app_origin with the query intact.
# Matched at the start of the query string or after «&», so «?myscreen=1» is NOT a launch.
#   ?screen=…               bot deep link into a Mini App screen (+ its companions below)
#   ?tgWebAppStartParam=…   Telegram's own start parameter
#   ?startapp=…             t.me/<bot>/<app>?startapp=… direct app links
#   ?start=…                agent referral links (AgentController)
map $args $mini_app_launch {
    default                     0;
    ~(^|&)screen=               1;
    ~(^|&)tgWebAppStartParam=   1;
    ~(^|&)startapp=             1;
    ~(^|&)start=                1;
    ~(^|&)sessionId=            1;
    ~(^|&)bookingId=            1;
    ~(^|&)songId=               1;
    ~(^|&)formatId=             1;
}

# Prerendered snapshot to serve when the `site` container is down or erroring.
# Built by frontend/scripts/prerender-site.mjs into dist/site-static/.
# Anything not listed here (the legal pages — their text lives in the admin, so there is no
# bundled snapshot) resolves to a file that does not exist; nginx/site-locations.conf turns that
# into the 404 page with a real 404 status.
map $uri $site_snapshot_file {
    default                   /site-static/__no-snapshot__.html;
    ~^/$                      /site-static/index.html;
    ~^/booking/?$             /site-static/booking.html;
    ~^/booking/form/?$        /site-static/booking-form.html;
    ~^/booking/success/?$     /site-static/booking-success.html;
    ~^/robots\.txt$           /site-static/robots.txt;
    ~^/sitemap\.xml$          /site-static/sitemap.xml;
}

# One include serves both deployment modes: behind the host proxy the real scheme arrives in
# X-Forwarded-Proto, in the standalone TLS build there is no such header and $scheme is correct.
map $http_x_forwarded_proto $site_forwarded_proto {
    default  $http_x_forwarded_proto;
    ''       $scheme;
}
