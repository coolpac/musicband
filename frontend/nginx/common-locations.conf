# ─────────────────────────────────────────────────────────────────────────────
# Locations shared by BOTH virtual hosts served from this container
# (see nginx-behind-proxy.conf): the public website on vgulcover.ru and the
# Telegram/Max Mini App on vgul.cyberslon.ru.
#
# Hashed bundles, the API proxy, sockets and uploads are identical on both hosts;
# keeping them here means a change lands in both server blocks at once.
# ─────────────────────────────────────────────────────────────────────────────

# Healthcheck (exact match, no logs). The Dockerfile HEALTHCHECK hits it via 127.0.0.1,
# i.e. with no meaningful Host header — so it must exist in the default server too.
location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
}

# Hashed asset bundles — immutable for a year
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}
location /js/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# API → backend
location /api/ {
    client_max_body_size 64m;
    client_body_buffer_size 256k;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
}
